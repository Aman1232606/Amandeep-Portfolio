<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SQL database analytics workflow</title>
  <desc id="desc">SQL query fragments connect to a relational database and flow into a structured analytical result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101920"/><stop offset=".55" stop-color="#0a1115"/><stop offset="1" stop-color="#111a17"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67d6c5"/><stop offset="1" stop-color="#a9e9bb"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b2a30" stop-opacity=".95"/><stop offset="1" stop-color="#10191e" stop-opacity=".9"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#51c9b5" stop-opacity=".18"/><stop offset="1" stop-color="#51c9b5" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#b7ded7" stroke-opacity=".045"/></pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
