<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">UrbanCart business intelligence dashboard</title>
  <desc id="desc">A dark glass dashboard composition with retail analytics panels, trend charts, category bars and an abstract geographic insight map.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111814"/><stop offset=".58" stop-color="#0b110e"/><stop offset="1" stop-color="#151b14"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9bdc6c"/><stop offset="1" stop-color="#66cdbd"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1d2a22" stop-opacity=".95"/><stop offset="1" stop-color="#111a15" stop-opacity=".92"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#a6df70" stop-opacity=".17"/><stop offset="1" stop-color="#a6df70" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d5edce" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#grid)"/><circle cx="950" cy="245" r="360" fill="url(#glow)"/>
  <text x="64" y="68" font-family="Arial,sans-serif" font-size="13" letter-spacing="3" fill="#b7e983">URBANCART / SUPERSTORE</text>
  <text x="64" y="105" font-family="Arial,sans-serif" font-size="23" font-weight="600" fill="#edf1e9">Retail data / business intelligence</text>
