    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42c9d9"/><stop offset="1" stop-color="#a5f0e7"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#3cc8d4" stop-opacity=".2"/><stop offset="1" stop-color="#3cc8d4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#a7d3d0" stroke-opacity=".055"/></pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
