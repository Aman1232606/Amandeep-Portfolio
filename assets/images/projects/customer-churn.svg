<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Customer analytics and churn patterns</title>
  <desc id="desc">A connected customer network flows into an abstract analysis dashboard with charts for exploring retention and churn patterns.</desc>
  <defs>
